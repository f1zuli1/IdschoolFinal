<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - VulnLab</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0d1117;
    color: #c9d1d9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .register-container {
    background-color: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    box-sizing: border-box;
  }
  .register-header {
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 20px;
    text-align: center;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 14px;
    color: #8b949e;
  }
  .form-group input {
    width: 100%;
    padding: 10px;
    background-color: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
  }
  .form-group input:focus {
    outline: none;
    border-color: #58a6ff;
  }
  .register-btn {
    width: 100%;
    padding: 10px;
    background-color: #238636;
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }
  .register-btn:hover {
    background-color: #2ea043;
  }
  .links {
    margin-top: 15px;
    text-align: center;
    font-size: 13px;
  }
  .links a {
    color: #58a6ff;
    text-decoration: none;
  }
  .links a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">Create Account</div>
    
    <form action="/register" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="register-btn">Sign Up</button>
    </form>

    <div class="links">
      Already have an account? <a href="/sqlinjection">Log in</a>
    </div>
  </div>
</body>
</html>
