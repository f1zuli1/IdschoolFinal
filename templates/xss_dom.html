<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM-based XSS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f4f5f7; color: #1f2328; font-family: "Segoe UI", Arial, sans-serif; }
  header { background: #1c2b39; color: #e6e9ec; padding: 14px 28px; border-bottom: 3px solid #2f4a5e; font-size: 15px; font-weight: 600; }
  main { max-width: 620px; margin: 40px auto; padding: 0 20px; }
  .tag { display:inline-block; font-size:11px; font-weight:600; background:#e8ecf3; color:#2f4a5e; padding:3px 8px; border-radius:3px; margin-bottom:14px; }
  .panel { background: #ffffff; border: 1px solid #d7dbe0; padding: 22px 24px; }
  .panel h2 { font-size: 14px; color: #1c2b39; margin-bottom: 6px; }
  .panel .note { font-size: 12.5px; color: #6b7580; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #4a5560; margin-bottom: 6px; font-weight: 600; }
  input[type=text] { width: 100%; border: 1px solid #ccd2d8; border-radius: 3px; padding: 10px; font-size: 13px; font-family: inherit; }
  input[type=text]:focus { outline: none; border-color: #2f4a5e; }
  button.submit { margin-top: 12px; background: #1c2b39; color: #fff; border: none; padding: 9px 16px; font-size: 13px; border-radius: 3px; cursor: pointer; }
  button.submit:hover { background: #2f4a5e; }
  .results { margin-top: 26px; border-top: 1px solid #e7e9ec; padding-top: 16px; }
  .results h3 { font-size: 12px; color: #6b7580; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 10px; }
  #output { background: #f9fafb; border: 1px solid #e7e9ec; padding: 10px 12px; font-size: 13px; color: #2a323b; min-height: 20px; word-break: break-word; }
  .example { font-size: 12px; color: #6b7580; margin-top: 10px; word-break: break-all; }
  a.back { display: inline-block; margin-top: 20px; font-size: 12.5px; color: #4a5560; }
</style>
</head>
<body>

<header>Application Security — XSS: DOM-based</header>

<main>
  <span class="tag">DOM-based XSS</span>
  <div class="panel">
    <h2>Greeting widget</h2>

    <form onsubmit="return false;">
      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="e.g. Alex">
      <button class="submit" onclick="setGreeting()">Set greeting</button>
    </form>

    <div class="results">
      <h3>Greeting</h3>
      <div id="output"></div>
    </div>
  </div>

  <a class="back" href="/xss">&larr; Back to XSS modules</a>
</main>

<script>
  // VULNERABILITY: value taken from the URL fragment and written into
  // the DOM with innerHTML, with no sanitization at all.
  function renderFromHash() {
    var hash = decodeURIComponent(location.hash.slice(1));
    if (hash) {
      document.getElementById('output').innerHTML = 'Hello, ' + hash + '!';
    }
  }

  function setGreeting() {
    var name = document.getElementById('name').value;
    location.hash = encodeURIComponent(name);
    renderFromHash();
  }

  window.addEventListener('hashchange', renderFromHash);
  window.addEventListener('DOMContentLoaded', renderFromHash);
</script>

</body>
</html>
