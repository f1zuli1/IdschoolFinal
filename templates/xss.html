<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSS Labs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f4f5f7;
    color: #1f2328;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
  }

  header {
    background: #1c2b39;
    color: #e6e9ec;
    padding: 14px 28px;
    border-bottom: 3px solid #2f4a5e;
    font-size: 15px;
    font-weight: 600;
  }

  main {
    max-width: 760px;
    margin: 40px auto;
    padding: 0 20px;
  }

  table.modules {
    width: 100%;
    border-collapse: collapse;
    background: #ffffff;
    border: 1px solid #d7dbe0;
  }

  table.modules th {
    text-align: left;
    background: #eceff2;
    color: #4a5560;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 10px 16px;
    border-bottom: 1px solid #d7dbe0;
  }

  table.modules td {
    padding: 14px 16px;
    font-size: 13.5px;
    border-bottom: 1px solid #e7e9ec;
    vertical-align: middle;
  }

  table.modules tr:last-child td { border-bottom: none; }

  .mod-name { font-weight: 600; color: #1c2b39; }

  .btn-open {
    background: #1c2b39;
    color: #ffffff;
    border: none;
    padding: 7px 14px;
    font-size: 12.5px;
    cursor: pointer;
    border-radius: 3px;
    text-decoration: none;
    display: inline-block;
  }
  .btn-open:hover { background: #2f4a5e; }

  a.back {
    display: inline-block;
    margin-top: 20px;
    font-size: 12.5px;
    color: #4a5560;
  }
</style>
</head>
<body>

<header>Web Security Academy — Labs</header>

<main>
  <table class="modules">
    <tr>
      <th>Lab</th>
      <th>Action</th>
    </tr>
    <tr>
      <td><div class="mod-name">Product page — customer reviews</div></td>
      <td><a class="btn-open" href="/xss/stored">Open lab</a></td>
    </tr>
    <tr>
      <td><div class="mod-name">Search functionality</div></td>
      <td><a class="btn-open" href="/xss/reflected">Open lab</a></td>
    </tr>
    <tr>
      <td><div class="mod-name">Client-side greeting widget</div></td>
      <td><a class="btn-open" href="/xss/dom">Open lab</a></td>
    </tr>
  </table>

  <a class="back" href="/">&larr; Back to module list</a>
</main>

</body>
</html>
